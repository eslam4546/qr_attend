name: qr_attend
description: "QR-Attend — University attendance tracking via dynamic QR codes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.7

  # Architecture & State Management
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  dartz: ^0.10.1
  equatable: ^2.0.7

  # Routing
  go_router: ^15.1.2

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.2

  # PDF
  pdf: ^3.11.2
  printing: ^5.14.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
